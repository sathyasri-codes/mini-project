<!DOCTYPE html>
<html>
<head>
    <title>Explore Resources - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4">Explore Available Resources</h1>

    <div class="row g-4">
        {% for resource in resources %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5>{{ resource.name }}</h5>
                    <p><strong>Type:</strong> {{ resource.type }}</p>
                    <p>{{ resource.description }}</p>

                    <a href="{{ url_for('resource_details', index=loop.index0) }}"
   class="btn btn-primary">View Details</a>
                       class="btn btn-primary">Book Resource</a>
                </div>
            </div>
        </div>
        {% else %}
        <p class="text-center">No resources are available right now.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
