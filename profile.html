<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Student Profile</h1>
        <p class="subtitle">Enter your details to get career guidance.</p>

        <form action="/profile" method="POST">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="qualification">Qualification</label>
            <input type="text" id="qualification" name="qualification" placeholder="e.g. Class 12, B.Sc." required>

            <label for="percentage">Percentage</label>
            <input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01" placeholder="Enter your percentage" required>

            <label for="skills">Skills</label>
            <textarea id="skills" name="skills" placeholder="e.g. Communication, Programming" required></textarea>

            <label for="interest">Interest</label>
            <textarea id="interest" name="interest" placeholder="What subjects or activities interest you?" required></textarea>

            <label for="preferred_course">Preferred Course</label>
            <input type="text" id="preferred_course" name="preferred_course" placeholder="Enter your preferred course" required>

            <label for="career_goal">Career Goal</label>
            <textarea id="career_goal" name="career_goal" placeholder="What career would you like to pursue?" required></textarea>

            <label for="school_sports_experience">School / Sports Experience</label>
            <textarea id="school_sports_experience" name="school_sports_experience" placeholder="Mention activities, clubs, or sports experience"></textarea>

            <button type="submit">Submit Profile</button>

        </form>
    </div>

</body>
</html>
