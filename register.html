<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ShareHub</a>
            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card mx-auto p-4 shadow" style="max-width: 450px;">
            <h2 class="text-center mb-4">Create an Account</h2>

            <form method="POST" action="{{ url_for('register') }}">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input class="form-control" type="text"
                           name="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input class="form-control" type="email"
                           name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password"
                           name="password" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input class="form-control" type="password"
                           name="confirm_password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Register As</label>
                    <select class="form-select" name="role" required>
                        <option value="">Choose Role</option>
                        <option value="student">Student</option>
                        <option value="owner">Resource Owner</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-3">
                Already registered?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </main>

</body>
</html>
