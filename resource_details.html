<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ resource.name }} - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <h1>{{ resource.name }}</h1>
    <p><strong>Type:</strong> {{ resource.type }}</p>
    <p>{{ resource.description }}</p>

    <a href="{{ url_for('booking', resource=resource.name) }}"
       class="btn btn-primary">Request Booking</a>

    <a href="{{ url_for('explore') }}"
       class="btn btn-secondary">Back to Explore</a>
</div>

</body>
</html>
