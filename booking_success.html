<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Submitted - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ShareHub</a>
        </div>
    </nav>

    <main class="container py-5 text-center">
        <div class="content-card mx-auto">
            <h1 class="text-success">Booking Request Submitted!</h1>
            <p class="mt-3">Thank you, {{ name }}.</p>
            <p>Your request for <strong>{{ resource }}</strong> has been submitted.</p>
            <p>You can check its status in your student dashboard.</p>
            <a href="{{ url_for('booking_status') }}" class="btn btn-primary">My Booking Status</a>
            <a href="{{ url_for('explore') }}" class="btn btn-outline-secondary">Explore Resources</a>
        </div>
    </main>
</body>
</html>
